<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日复习 - 奥赛生物智能学习伴侣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .option-button.correct { border-color: #22c55e !important; background-color: #f0fdf4 !important; } 
        .option-button.wrong { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    </style>
</head>
<body class="p-6">
    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-2xl w-full space-y-6">
        <div class="flex justify-between items-center border-b pb-4 mb-4">
            <h2 class="text-2xl font-bold text-slate-800">今日复习</h2>
            <span class="text-lg font-semibold text-slate-600">1/5 题</span>
        </div>

        <div id="question-area" class="space-y-6">
            <!-- Question will be loaded here -->
        </div>

        <div class="flex justify-end space-x-4 pt-4 border-t mt-6">
            <button id="show-explanation-btn" class="px-6 py-3 bg-slate-200 text-slate-700 font-semibold rounded-xl hover:bg-slate-300 transition-colors hidden">查看解析</button>
            <button id="next-question-btn" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors hidden">下一题</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const questionArea = document.getElementById('question-area');
            const showExplanationBtn = document.getElementById('show-explanation-btn');
            const nextQuestionBtn = document.getElementById('next-question-btn');
            let currentQuestionIndex = 0;
            const questions = [
                {
                    id: 'q-review-1',
                    text: '当你屏住呼吸时，以下哪种血液气体变化首先导致呼吸冲动？',
                    options: [
                        { id: 'A', text: '氧气升高' },
                        { id: 'B', text: '氧气下降' },
                        { id: 'C', text: '二氧化碳升高' },
                        { id: 'D', text: '二氧化碳下降' }
                    ],
                    correctAnswer: 'C',
                    explanation: '呼吸冲动主要由血液中二氧化碳（CO2）水平的升高引发，这会导致血液pH值下降。化学感受器检测到这一变化并向呼吸控制中心发出信号。'
                },
                {
                    id: 'q-review-2',
                    text: '光合作用中，光反应的产物不包括？',
                    options: [
                        { id: 'A', text: 'ATP' },
                        { id: 'B', text: 'NADPH' },
                        { id: 'C', text: 'O2' },
                        { id: 'D', text: '葡萄糖' }
                    ],
                    correctAnswer: 'D',
                    explanation: '葡萄糖是暗反应（卡尔文循环）的产物，光反应的产物是ATP、NADPH和O2。'
                }
            ];

            function renderQuestion(question) {
                questionArea.innerHTML = `
                    <p class="text-xl font-semibold text-slate-800 mb-4">${question.text}</p>
                    <div class="space-y-3 options-list">
                        ${question.options.map(opt => `
                            <button class="option-button w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 transition-all"
                                data-option="${opt.id}">${opt.id}. ${opt.text}</button>
                        `).join('')}
                    </div>
                    <div id="explanation-content" class="mt-4 text-sm hidden">
                        <p class="p-4 bg-green-50 text-green-800 border-l-4 border-green-500 rounded-r-lg"><strong>解析：</strong>${question.explanation}</p>
                    </div>
                `;
                attachListeners(question);
                showExplanationBtn.classList.add('hidden');
                nextQuestionBtn.classList.add('hidden');
            }

            function attachListeners(question) {
                document.querySelectorAll('.option-button').forEach(button => {
                    button.addEventListener('click', function() {
                        const selectedAnswer = this.dataset.option;
                        const isCorrect = selectedAnswer === question.correctAnswer;
                        
                        document.querySelectorAll('.option-button').forEach(btn => {
                            btn.disabled = true; // Disable all options after selection
                            const optId = btn.dataset.option;
                            if (optId === question.correctAnswer) {
                                btn.classList.add('correct');
                            } else if (optId === selectedAnswer) {
                                btn.classList.add('wrong');
                            }
                        });

                        // Show explanation and next button
                        const explanationContent = document.getElementById('explanation-content');
                        explanationContent.classList.remove('hidden');
                        if (!isCorrect) {
                            explanationContent.querySelector('p').classList.remove('bg-green-50', 'text-green-800', 'border-green-500');
                            explanationContent.querySelector('p').classList.add('bg-red-50', 'text-red-800', 'border-red-500');
                        }
                        showExplanationBtn.classList.remove('hidden');
                        nextQuestionBtn.classList.remove('hidden');

                        // In a real app, here you'd send the answer to the backend
                        console.log(`Question ${question.id} answered: ${selectedAnswer}, Correct: ${isCorrect}`);
                    });
                });

                showExplanationBtn.addEventListener('click', function() {
                    const explanationContent = document.getElementById('explanation-content');
                    explanationContent.classList.toggle('hidden');
                });

                nextQuestionBtn.addEventListener('click', function() {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        renderQuestion(questions[currentQuestionIndex]);
                        document.querySelector('span.text-lg.font-semibold').textContent = `${currentQuestionIndex + 1}/${questions.length} 题`;
                    } else {
                        questionArea.innerHTML = `
                            <div class="text-center py-12">
                                <p class="text-2xl font-bold text-green-600 mb-4">恭喜！今日复习已完成！</p>
                                <p class="text-slate-600">你已经巩固了所有到期知识点。</p>
                            </div>
                        `;
                        showExplanationBtn.classList.add('hidden');
                        nextQuestionBtn.classList.add('hidden');
                    }
                });
            }

            // Initial load
            if (questions.length > 0) {
                renderQuestion(questions[currentQuestionIndex]);
                document.querySelector('span.text-lg.font-semibold').textContent = `${currentQuestionIndex + 1}/${questions.length} 题`;
            } else {
                questionArea.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-2xl font-bold text-slate-600 mb-4">今日暂无复习任务</p>
                        <p class="text-slate-500">继续学习新知识吧！</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
