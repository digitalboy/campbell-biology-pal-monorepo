<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奥赛生物智能学习伴侣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #e2e8f0; } ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; border: 2px solid #e2e8f0; } ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        #book-container { perspective: 1500px; }
        .page { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; transition: transform 0.8s ease-in-out; transform-style: preserve-3d; }
        .page img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .page.flipping-next { transform-origin: left center; transform: rotateY(-180deg); } .page.flipping-prev { transform-origin: right center; transform: rotateY(180deg); }
        .page-nav-button { position: absolute; top: 50%; transform: translateY(-50%); z-index: 30; background-color: rgba(30, 41, 59, 0.4); backdrop-filter: blur(4px); color: white; border-radius: 9999px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: all 0.3s ease; }
        #pdf-panel:hover .page-nav-button { opacity: 1; } .page-nav-button.disabled { opacity: 0 !important; cursor: not-allowed; }
        #pdf-highlight-overlay { position: absolute; background-image: linear-gradient(to right, rgba(250, 204, 21, 0.4), rgba(249, 115, 22, 0.4)); border: 2px solid #f59e0b; border-radius: 4px; opacity: 0; transition: all 0.3s ease-in-out; pointer-events: none; }
        .mindmap-node { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.75rem; color: #fff; } .mindmap-node:hover { transform: scale(1.05) translateY(-2px); } .mindmap-node.active { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.4); }
        .donut-ring-progress { transition: stroke-dashoffset 0.5s ease-in-out; }
        .option-button.correct { border-color: #22c55e !important; background-color: #f0fdf4 !important; } .option-button.wrong { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden">
    <!-- Top Global Header -->
    <header class="bg-white/80 backdrop-blur-lg border-b border-slate-200 px-4 lg:px-6 py-3 flex items-center justify-between z-40 flex-shrink-0">
        <!-- Logo -->
        <div class="flex items-center flex-shrink-0">
            <div class="p-2 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-lg mr-3 shadow-lg shadow-indigo-500/30"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6 text-white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zM17.99 9.21c-.13.58-.21 1.17-.21 1.79 0 4.08-3.05 7.44-7 7.93V18c0-1.1-.9-2-2-2v-1l-4.79-4.79C4.56 9.33 5.87 8 7.5 8H12c1.38 0 2.5-1.12 2.5-2.5S13.38 3 12 3c-1.47 0-2.7 1.28-2.96 2.96L7 8H5.5C4.26 8 3.29 8.63 2.82 9.58 4.26 5.6 7.84 3 12 3c3.53 0 6.47 2.31 7.58 5.42z"/></svg></div>
            <span class="text-xl font-bold text-slate-800">BioOlympiad Companion</span>
        </div>
        
        <!-- Search Bar -->
        <div class="flex-grow flex justify-center px-4">
            <div class="relative w-full max-w-md">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-slate-400"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
                </div>
                <input type="text" class="bg-slate-100 border border-transparent text-slate-900 text-sm rounded-full focus:ring-2 focus:ring-indigo-500 focus:border-transparent block w-full pl-11 p-2.5" placeholder="搜索知识点，例如“线粒体”...">
            </div>
        </div>

        <!-- User & Language Controls -->
        <div class="flex items-center space-x-5 flex-shrink-0">
            <!-- ADDED: Wrong-Answer Notebook Icon -->
            <button class="relative text-slate-500 hover:text-indigo-600 transition-colors" aria-label="打开错题本">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />
                </svg>
                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
            </button>
            
            <button id="open-dashboard-btn" class="cursor-pointer" aria-label="打开个人学习仪表盘">
                <img class="w-10 h-10 rounded-full ring-2 ring-offset-2 ring-indigo-500 hover:ring-violet-500 transition-all" src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="用户头像">
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6 p-6 overflow-hidden">
        <!-- Left Panel: PDF Viewer -->
        <section id="pdf-panel" class="bg-white rounded-2xl shadow-lg flex flex-col relative">
            <div class="p-4 border-b border-slate-200 flex-shrink-0 flex items-center justify-between">
                <h2 class="font-bold text-lg text-slate-800">Campbell Biology (12th Edition)</h2>
                <div class="flex items-center space-x-2 bg-slate-100 rounded-full py-1 px-3 text-sm">
                    <span class="text-slate-500">第</span>
                    <input id="page-input" type="number" value="192" class="w-12 text-center bg-transparent focus:outline-none font-semibold text-slate-800">
                    <span id="total-pages" class="text-slate-500">/ 1488 页</span>
                </div>
            </div>
            <div id="book-container" class="flex-grow p-4 relative flex justify-center items-center overflow-hidden">
                <div id="page-flipper" class="w-full h-full max-w-xl max-h-full relative">
                    <div id="current-page" class="page z-10">
                        <img id="current-page-img" src="" alt="Current PDF Page">
                        <div id="pdf-highlight-overlay"></div>
                    </div>
                    <div id="next-page" class="page z-0">
                        <img id="next-page-img" src="" alt="Next PDF Page">
                    </div>
                </div>
            </div>
            <button id="prev-page-btn" class="page-nav-button" style="left: 24px;"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg></button>
            <button id="next-page-btn" class="page-nav-button" style="right: 24px;"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg></button>
        </section>

        <!-- Right Panel: Intelligent Companion -->
        <section class="bg-white rounded-2xl shadow-lg flex flex-col">
             <div class="flex-grow overflow-y-auto p-6 space-y-6" id="companion-content-area">
                <!-- Content will be rendered here by JavaScript -->
             </div>
        </section>
    </main>
    
    <!-- MODAL CONTAINER: This is the placeholder for our dialog -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- MOCK DATA ---
            let currentPage = 192;
            const totalPages = 1488;
            let isFlipping = false;
            let currentQuestionIndex = 0;

            const pageData = {
                192: {
                    knowledgePoints: ["光合作用", "叶绿体", "光反应", "卡尔文循环", "ATP", "NADPH", "色素", "叶绿素", "能量转换", "CO₂固定", "C3植物"],
                    mindmapHtml: `<h3 class="text-lg font-semibold mb-8 text-slate-800">知识网络：光合作用概述</h3><div class="relative h-48 flex justify-center items-center"><svg class="absolute w-full h-full" style="top:0; left:0;"><defs><linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a5b4fc"/><stop offset="100%" stop-color="#c4b5fd"/></linearGradient></defs><line x1="50%" y1="20%" x2="25%" y2="80%" stroke="url(#lineGradient)" stroke-width="2" stroke-linecap="round"/><line x1="50%" y1="20%" x2="75%" y2="80%" stroke="url(#lineGradient)" stroke-width="2" stroke-linecap="round"/></svg><div class="absolute mindmap-node bg-gradient-to-br from-amber-400 to-orange-500 shadow-lg shadow-amber-500/30 active" style="top:10%; left:50%; transform:translateX(-50%);" onclick="simulateHighlight({top: '10%', left: '15%', width: '70%', height: '15%'}, this)">光合作用</div><div class="absolute mindmap-node bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-500/30" style="top:70%; left:25%; transform:translateX(-50%);" onclick="simulateHighlight({top: '30%', left: '10%', width: '35%', height: '30%'}, this)">光反应</div><div class="absolute mindmap-node bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-500/30" style="top:70%; left:75%; transform:translateX(-50%);" onclick="simulateHighlight({top: '65%', left: '50%', width: '40%', height: '25%'}, this)">卡尔文循环</div></div>`,
                    questions: [ { id: 'q1', text: "光合作用的两个主要阶段是什么？", options: ["糖酵解和柠檬酸循环", "光反应和卡尔文循环", "有氧呼吸和无氧呼吸"], correctAnswer: "B", stats: { attempts: 5, correct: 4 }, userAnswer: null }, { id: 'q2', text: "在植物细胞中，光合作用主要发生在哪个细胞器？", options: ["线粒体", "细胞核", "叶绿体", "液泡"], correctAnswer: "C", stats: { attempts: 2, correct: 1 }, userAnswer: null }, { id: 'q3', text: "以下哪项是光反应的产物？", options: ["二氧化碳和水", "ATP和NADPH", "葡萄糖"], correctAnswer: "B", stats: { attempts: 0, correct: 0 }, userAnswer: null } ]
                },
                193: { 
                    knowledgePoints: ["叶绿体结构", "类囊体", "基粒", "基质"],
                    mindmapHtml: `<h3 class="text-lg font-semibold text-slate-800">知识网络：叶绿体结构</h3><div class="text-slate-500 text-center p-8">此页面的思维导图占位符</div>`, 
                    questions: [] 
                }
            };
            
            // --- DOM Elements ---
            const companionArea = document.getElementById('companion-content-area');
            const pageInputCtrl = document.getElementById('page-input');
            const totalPagesSpanCtrl = document.getElementById('total-pages');
            const prevPageBtn = document.getElementById('prev-page-btn');
            const nextPageBtn = document.getElementById('next-page-btn');
            const currentPageImg = document.getElementById('current-page-img');
            const nextPageImg = document.getElementById('next-page-img');
            const currentPageDiv = document.getElementById('current-page');
            const nextPageDiv = document.getElementById('next-page');

            // --- RENDER FUNCTIONS ---
            function renderCompanionPanel() {
                const data = pageData[currentPage] || pageData[193];
                let contentHTML = renderKnowledgeTags(data.knowledgePoints) +
                                  `<div id="mindmap-view" class="mt-6">${data.mindmapHtml}</div>` +
                                  '<hr class="border-slate-200">' +
                                  '<div id="questions-container" class="space-y-6"></div>';
                companionArea.innerHTML = contentHTML;
                attachTagListeners();
                currentQuestionIndex = 0;
                renderQuestionsForPage(currentPage);
            }

            function renderKnowledgeTags(points) {
                if (!points || points.length === 0) return '';
                const colors = [ { bg: 'bg-sky-100', text: 'text-sky-800' }, { bg: 'bg-violet-100', text: 'text-violet-800' }, { bg: 'bg-lime-100', text: 'text-lime-800' }, { bg: 'bg-rose-100', text: 'text-rose-800' }, { bg: 'bg-amber-100', text: 'text-amber-800' }, { bg: 'bg-teal-100', text: 'text-teal-800' } ];
                const maxVisible = 7;
                let visibleTagsHTML = '', hiddenTagsHTML = '';
                points.forEach((point, index) => {
                    const color = colors[index % colors.length];
                    const tagHTML = `<span class="knowledge-point-tag cursor-pointer inline-block px-2.5 py-1 text-sm font-semibold rounded-full transition-transform hover:scale-105 ${color.bg} ${color.text}">${point}</span>`;
                    if (index < maxVisible) visibleTagsHTML += tagHTML;
                    else hiddenTagsHTML += tagHTML;
                });
                let moreButtonHTML = points.length > maxVisible ? `<button id="more-tags-btn" class="inline-block px-2.5 py-1 text-sm font-semibold rounded-full bg-slate-200 text-slate-700 hover:bg-slate-300 transition-colors">More +${points.length - maxVisible}</button>` : '';
                return `<div class="knowledge-points-card bg-slate-50 border border-slate-200 rounded-xl p-4"><div id="tags-wrapper" class="flex flex-wrap gap-2">${visibleTagsHTML}<div id="hidden-tags-container" class="contents">${hiddenTagsHTML}</div>${moreButtonHTML}</div></div>`;
            }

            function attachTagListeners() {
                const moreBtn = document.getElementById('more-tags-btn');
                if (moreBtn) {
                    moreBtn.addEventListener('click', () => {
                        const hiddenContainer = document.getElementById('hidden-tags-container');
                        hiddenContainer.classList.remove('contents');
                        hiddenContainer.classList.add('flex', 'flex-wrap', 'gap-2');
                        moreBtn.remove();
                    }, { once: true });
                }
            }
            
            function renderQuestionsForPage(page) {
                const questionsContainer = document.getElementById('questions-container');
                const data = pageData[page] || { questions: [] };
                if (!questionsContainer) return;

                if (data.questions.length === 0) {
                    questionsContainer.innerHTML = `<div class="text-center py-8"><svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg><h3 class="mt-2 text-sm font-medium text-slate-800">暂无关联题目</h3><p class="mt-1 text-sm text-slate-500">此页暂无练习题。</p></div>`;
                    return;
                }

                const panoramicDashboardHTML = `<div class="flex justify-between items-center"><h3 class="text-lg font-semibold text-slate-800">本页关联题目</h3><div id="panoramic-nav" class="flex items-center space-x-2"></div></div>`;
                questionsContainer.innerHTML = panoramicDashboardHTML;
                renderDonutNav(page);

                const question = data.questions[currentQuestionIndex];
                const isAnswered = question.userAnswer !== null;

                const questionDetailHTML = `<div class="question-item bg-slate-50/80 rounded-xl p-5 border border-slate-200" data-question-id="${question.id}" data-correct-answer="${question.correctAnswer}"><p class="font-semibold text-slate-800 text-lg pr-8 mb-4">${currentQuestionIndex + 1}. ${question.text}</p><div class="space-y-3 options-list">${question.options.map((opt, i) => { const optionLetter = String.fromCharCode(65 + i); let classes = 'option-button w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 transition-all'; if (isAnswered) { if (optionLetter === question.correctAnswer) classes += ' correct'; else if (optionLetter === question.userAnswer) classes += ' wrong'; } return `<button class=" ${classes}" data-option="${optionLetter}">${optionLetter}. ${opt}</button>`; }).join('')}</div><div class="explanation-area mt-4 text-sm hidden"><p class="p-4 bg-green-50 text-green-800 border-l-4 border-green-500 rounded-r-lg"><strong>解析：</strong>光反应将光能转化为化学能储存在ATP和NADPH中，而卡尔文循环则利用这些化学能将CO₂固定为糖。</p></div></div>`;
                questionsContainer.insertAdjacentHTML('beforeend', questionDetailHTML);
                
                if (isAnswered) showExplanation(question.correctAnswer === question.userAnswer);
                attachAnswerListeners(page);
            }

            function renderDonutNav(page) {
                const navContainer = document.getElementById('panoramic-nav');
                if (!navContainer) return;
                
                const questions = pageData[page].questions;
                let navHTML = `<svg width="0" height="0" class="absolute"><defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8" /><stop offset="100%" stop-color="#a78bfa" /></linearGradient></defs></svg>`;
                questions.forEach((q, index) => {
                    const accuracy = q.stats.attempts > 0 ? (q.stats.correct / q.stats.attempts) * 100 : 0;
                    const radius = 16, circumference = 2 * Math.PI * radius, offset = circumference - (accuracy / 100) * circumference;
                    const isActive = index === currentQuestionIndex;
                    navHTML += `<button class="donut-nav-item relative rounded-full transition-all ${isActive ? 'ring-2 ring-offset-2 ring-indigo-500' : 'hover:ring-2 hover:ring-slate-300'}" data-index="${index}" title="题目 ${index + 1}: ${Math.round(accuracy)}% 正确率"><svg class="w-10 h-10" viewBox="0 0 40 40"><circle class="text-slate-200" stroke-width="5" stroke="currentColor" fill="transparent" r="${radius}" cx="20" cy="20"/><circle class="donut-ring-progress" stroke-width="5" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" stroke="url(#progressGradient)" fill="transparent" r="${radius}" cx="20" cy="20" transform="rotate(-90 20 20)"/><text class="font-semibold text-slate-600 text-xs" x="50%" y="50%" text-anchor="middle" dy=".3em">${index + 1}</text></svg></button>`;
                });
                navContainer.innerHTML = navHTML;
                document.querySelectorAll('.donut-nav-item').forEach(btn => btn.addEventListener('click', () => { currentQuestionIndex = parseInt(btn.dataset.index, 10); renderQuestionsForPage(page); }));
            }
            
            function showExplanation(isCorrect) {
                const explanationArea = document.querySelector('.explanation-area');
                if (explanationArea) {
                    explanationArea.style.display = 'block';
                    if (!isCorrect) {
                       explanationArea.querySelector('p').classList.remove('bg-green-50', 'text-green-800', 'border-green-500');
                       explanationArea.querySelector('p').classList.add('bg-red-50', 'text-red-800', 'border-red-500');
                    }
                }
            }

            function attachAnswerListeners(page) {
                const questionItem = document.querySelector('.question-item');
                if (!questionItem) return;
                const questionData = pageData[page].questions[currentQuestionIndex];
                if (questionData.userAnswer !== null) return; 
                questionItem.querySelectorAll('.option-button').forEach(button => {
                    button.addEventListener('click', () => {
                        const selectedAnswer = button.dataset.option;
                        questionData.userAnswer = selectedAnswer;
                        questionData.stats.attempts++;
                        const isCorrect = selectedAnswer === questionData.correctAnswer;
                        if (isCorrect) questionData.stats.correct++;
                        showExplanation(isCorrect);
                        renderDonutNav(page);
                        questionItem.querySelectorAll('.option-button').forEach(btn => {
                            btn.disabled = true;
                            const opt = btn.dataset.option;
                            if (opt === questionData.correctAnswer) btn.classList.add('correct');
                            else if (opt === selectedAnswer) btn.classList.add('wrong');
                        });
                    });
                });
            }

            // --- PAGE FLIP LOGIC & UTILITIES ---
            function getPageUrl(page) { return `https://placehold.co/800x1131/FFFFFF/334155?font=inter&text=Page+${page}`; }
            function flipPage(direction) {
                if (isFlipping) return;
                const targetPage = direction === 'next' ? currentPage + 1 : currentPage - 1;
                if (targetPage < 1 || targetPage > totalPages) return;
                isFlipping = true; updateControls();
                nextPageImg.src = getPageUrl(targetPage);
                const flipClass = direction === 'next' ? 'flipping-next' : 'flipping-prev';
                if (direction === 'prev') { nextPageDiv.style.zIndex = 20; currentPageDiv.style.zIndex = 10; nextPageDiv.classList.add(flipClass); } 
                else { currentPageDiv.style.zIndex = 20; nextPageDiv.style.zIndex = 10; currentPageDiv.classList.add(flipClass); }
                setTimeout(() => {
                    currentPage = targetPage; currentPageImg.src = getPageUrl(currentPage);
                    currentPageDiv.classList.remove('flipping-next', 'flipping-prev'); nextPageDiv.classList.remove('flipping-next', 'flipping-prev');
                    currentPageDiv.style.zIndex = 10; nextPageDiv.style.zIndex = 0;
                    renderCompanionPanel(); isFlipping = false; updateControls();
                }, 800);
            }
            function updateControls() {
                pageInputCtrl.value = currentPage;
                prevPageBtn.classList.toggle('disabled', currentPage <= 1 || isFlipping);
                nextPageBtn.classList.toggle('disabled', currentPage >= totalPages || isFlipping);
            }
            
            // --- INITIALIZATION ---
            totalPagesSpanCtrl.textContent = `/ ${totalPages} 页`;
            currentPageImg.src = getPageUrl(currentPage);
            renderCompanionPanel(); updateControls();
            prevPageBtn.addEventListener('click', () => flipPage('prev'));
            nextPageBtn.addEventListener('click', () => flipPage('next'));
            pageInputCtrl.addEventListener('change', () => {
                let newPage = parseInt(pageInputCtrl.value, 10);
                if (!isNaN(newPage) && newPage >= 1 && newPage <= totalPages) {
                    if (isFlipping) return; currentPage = newPage;
                    currentPageImg.src = getPageUrl(currentPage); renderCompanionPanel(); updateControls();
                } else { pageInputCtrl.value = currentPage; }
            });

            // --- MODAL LOGIC ---
            const openDashboardBtn = document.getElementById('open-dashboard-btn');
            const modalContainer = document.getElementById('modal-container');

            async function openDashboard() {
                modalContainer.innerHTML = `<div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center"><svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>`;
                modalContainer.classList.remove('hidden');
                try {
                    const response = await fetch('./personal_dashboard_dialog.html');
                    if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                    const dialogHtml = await response.text();
                    modalContainer.innerHTML = dialogHtml;
                    modalContainer.classList.add('flex', 'items-center', 'justify-center');
                    document.getElementById('close-modal-btn').addEventListener('click', closeDashboard);
                    document.getElementById('modal-backdrop').addEventListener('click', closeDashboard);
                } catch (error) {
                    console.error('Failed to fetch dashboard:', error);
                    modalContainer.innerHTML = `<div class="fixed inset-0 bg-slate-900/70 flex items-center justify-center text-white text-center p-8"><p>加载仪表盘失败。<br>请确保 'personal_dashboard_dialog.html' 文件存在于同一目录下。</p></div>`;
                    setTimeout(closeDashboard, 3000);
                }
            }
            function closeDashboard() {
                modalContainer.classList.add('hidden');
                modalContainer.innerHTML = '';
            }
            openDashboardBtn.addEventListener('click', openDashboard);
        });

        // Global function for mindmap node clicks
        function simulateHighlight(position, element) {
            const overlay = document.getElementById('pdf-highlight-overlay');
            Object.assign(overlay.style, { top: position.top, left: position.left, width: position.width, height: position.height, opacity: '1' });
            setTimeout(() => { overlay.style.opacity = '0'; }, 1500);
            const allNodes = document.querySelectorAll('.mindmap-node');
            allNodes.forEach(node => node.classList.remove('active'));
            if(element) element.classList.add('active');
        }
    </script>
</body>
</html>
