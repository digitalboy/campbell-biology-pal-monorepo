<!-- 
  Personal Learning Dashboard (Final Version)
  - Features a detailed line chart for progress analysis.
  - Uses Chart.js for data visualization.
-->
<div id="modal-backdrop" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm animate-fade-in"></div>

<div class="relative w-full max-w-5xl bg-slate-50 rounded-2xl shadow-2xl m-8 animate-scale-up" role="dialog" aria-modal="true">
    <!-- Modal Header -->
    <div class="flex items-start justify-between p-6 border-b border-slate-200">
        <div class="flex items-center gap-4">
            <div class="p-3 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-lg shadow-lg shadow-indigo-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            </div>
            <div>
                <h3 class="text-xl font-bold text-slate-800">学习进度分析</h3>
                <p class="text-sm text-slate-500">你好, Master! 这是你的学习趋势报告。</p>
            </div>
        </div>
        <button id="close-modal-btn" class="p-2 rounded-full text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6 space-y-6">
        <!-- Chart Section -->
        <div class="bg-white p-6 rounded-xl border border-slate-200">
            <!-- Chart Controls -->
            <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                <div class="flex items-center gap-2 p-1 bg-slate-100 rounded-full">
                    <button id="view-daily-btn" class="px-4 py-1.5 text-sm font-semibold rounded-full bg-white text-indigo-600 shadow">按日</button>
                    <button id="view-monthly-btn" class="px-4 py-1.5 text-sm font-semibold rounded-full text-slate-600">按月</button>
                </div>
                 <!-- Chart Legend -->
                <div class="flex items-center gap-4 text-sm font-medium text-slate-600">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                        <span>做题量</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-sky-400"></span>
                        <span>正确率</span>
                    </div>
                </div>
            </div>

            <!-- Chart Canvas -->
            <div class="h-64 md:h-80">
                <canvas id="learningChart"></canvas>
            </div>
        </div>
        
        <!-- Summary Cards & Quick Actions -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Today's Review Card (NEW) -->
            <div class="relative col-span-1 sm:col-span-2 lg:col-span-1 bg-gradient-to-br from-violet-500 to-indigo-600 p-5 rounded-xl text-white shadow-lg shadow-indigo-500/40 overflow-hidden">
                <p class="text-sm font-semibold text-indigo-200">智能复习</p>
                <p class="text-3xl font-bold">5 <span class="text-base font-medium text-indigo-200">题待办</span></p>
                <button class="mt-4 w-full px-4 py-2 text-sm font-bold bg-white/20 hover:bg-white/30 rounded-lg backdrop-blur-sm transition-colors">开始今日复习</button>
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute -bottom-4 -right-4 h-24 w-24 text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-sm font-medium text-slate-500">本月做题</p>
                <p class="text-3xl font-bold text-slate-800">1,204 <span class="text-base font-medium text-green-500">+15%</span></p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-sm font-medium text-slate-500">平均正确率</p>
                <p class="text-3xl font-bold text-slate-800">91.3%</p>
            </div>
             <div class="bg-white p-4 rounded-xl border-2 border-rose-200 bg-rose-50">
                <p class="text-sm font-medium text-rose-600">当前薄弱知识点</p>
                <p class="text-lg font-bold text-rose-800 truncate">基因转录调控</p>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes scale-up { 0% { opacity: 0; transform: scale(0.95) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    .animate-scale-up { animation: scale-up 0.3s ease-out forwards; }
</style>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    (function() {
        const dailyData = { labels: Array.from({length: 15}, (_, i) => `8/${i + 1}`), datasets: [ { label: '做题量', data: [25, 30, 45, 40, 60, 55, 70, 65, 80, 75, 90, 85, 100, 95, 110], borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', yAxisID: 'y', tension: 0.4, fill: true, }, { label: '正确率', data: [85, 88, 86, 90, 92, 91, 94, 93, 95, 94, 96, 95, 97, 96, 98], borderColor: '#38bdf8', backgroundColor: 'transparent', yAxisID: 'y1', tension: 0.4, } ] };
        const monthlyData = { labels: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月'], datasets: [ { label: '做题量', data: [450, 500, 650, 700, 800, 950, 1100, 1204], borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', yAxisID: 'y', tension: 0.3, fill: true, }, { label: '正确率', data: [82, 84, 85, 88, 89, 90, 92, 91], borderColor: '#38bdf8', backgroundColor: 'transparent', yAxisID: 'y1', tension: 0.3, } ] };
        const ctx = document.getElementById('learningChart').getContext('2d');
        const chartConfig = { type: 'line', data: dailyData, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false, }, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', titleFont: { weight: 'bold' }, bodySpacing: 4, padding: 12, callbacks: { label: function(context) { let label = context.dataset.label || ''; if (label) { label += ': '; } if (context.parsed.y !== null) { label += context.parsed.y; if(context.dataset.yAxisID === 'y1') { label += '%'; } } return label; } } } }, scales: { x: { grid: { display: false } }, y: { type: 'linear', display: true, position: 'left', grid: { color: '#e2e8f0' }, title: { display: true, text: '做题量 (道)' } }, y1: { type: 'linear', display: true, position: 'right', min: 50, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: '正确率 (%)' }, ticks: { callback: value => value + '%' } } } } };
        let learningChart = new Chart(ctx, chartConfig);
        const dailyBtn = document.getElementById('view-daily-btn');
        const monthlyBtn = document.getElementById('view-monthly-btn');
        function switchView(view) { if (view === 'daily') { learningChart.data = dailyData; dailyBtn.classList.add('bg-white', 'text-indigo-600', 'shadow'); monthlyBtn.classList.remove('bg-white', 'text-indigo-600', 'shadow'); } else { learningChart.data = monthlyData; monthlyBtn.classList.add('bg-white', 'text-indigo-600', 'shadow'); dailyBtn.classList.remove('bg-white', 'text-indigo-600', 'shadow'); } learningChart.update(); }
        dailyBtn.addEventListener('click', () => switchView('daily'));
        monthlyBtn.addEventListener('click', () => switchView('monthly'));
    })();
</script>
