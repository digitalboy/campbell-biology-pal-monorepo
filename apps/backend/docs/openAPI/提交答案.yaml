openapi: 3.1.0
info:
  title: Campbell Biology PAL API - 端点文档
  version: "1.5.1"
  description: "提交单个问题答案的 API 端点详细文档。"
servers:
  - url: "https://campbell-biology-pal-v2.digitalboyzone.workers.dev/api/v1"
    description: "生产环境服务器"
  - url: "http://localhost:3000/api/v1"
    description: "本地开发服务器"

paths:
  /questions/{questionId}/submit:
    post:
      tags:
        - "练习与评测 (Quiz & Assessment)"
      summary: "提交单个问题答案"
      description: |
        提交用户对特定问题的答案。后端将验证答案，记录结果，并更新用户的间隔重复学习计划。
        此端点需要通过 Bearer Token 进行身份验证。
      operationId: submitAnswer
      parameters:
        - name: questionId
          in: path
          required: true
          description: "要回答的问题的唯一ID。"
          schema:
            type: string
            example: "q-chp5-001"
      requestBody:
        description: "用户选择的答案选项ID列表。"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
            example:
              selectedAnswers: ["opt_1a", "opt_1c"]
      responses:
        "200":
          description: "成功提交答案并返回评测结果。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAnswerSuccessResponse"
              example:
                ok: true
                data:
                  isCorrect: false
                  correctAnswers: ["opt_1a", "opt_1d"]
                  explanation:
                    en: "The correct answer is A and D because..."
                    zh: "正确答案是A和D，因为..."
        "400":
          description: "请求格式错误，例如 `selectedAnswers` 缺失或类型不正确。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                ok: false
                message: "selectedAnswers is required and must be an array."
        "401":
          description: "未经授权。请求头中的 JWT 缺失或无效。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                ok: false
                message: "Authentication error: User ID not found in context."
        "404":
          description: "找不到指定ID的问题。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                ok: false
                message: "Question not found."
        "500":
          description: "服务器内部错误，无法处理答案提交。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                ok: false
                message: "Failed to process answer submission."
      security:
        - bearerAuth: []

components:
  schemas:
    SubmitAnswerRequest:
      type: object
      description: "提交答案的请求体结构。"
      properties:
        selectedAnswers:
          type: array
          items:
            type: string
            description: "用户选择的答案选项ID。"
            example: "opt_1a"
          description: "一个包含用户选择的答案选项ID的数组。"
      required:
        - selectedAnswers

    SubmitAnswerResult:
      type: object
      description: "答案评测结果的详细数据。"
      properties:
        isCorrect:
          type: boolean
          description: "用户的答案是否完全正确。"
        correctAnswers:
          type: array
          items:
            type: string
          description: "该问题的正确答案选项ID列表。"
        explanation:
          $ref: "#/components/schemas/MultilingualText"

    SubmitAnswerSuccessResponse:
      type: object
      description: "成功提交答案后的标准响应结构。"
      properties:
        ok:
          type: boolean
          description: "指示操作是否成功。"
          example: true
        data:
          $ref: "#/components/schemas/SubmitAnswerResult"

    ErrorResponse:
      type: object
      description: "标准错误响应结构。"
      properties:
        ok:
          type: boolean
          description: "指示操作是否成功。"
          example: false
        message:
          type: string
          description: "错误的详细信息。"

    MultilingualText:
      type: object
      description: "代表多语言文本内容。"
      properties:
        en:
          type: string
        zh:
          type: string
      example:
        en: "This is an example."
        zh: "这是一个例子。"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "用于API认证的 Firebase JWT。"
